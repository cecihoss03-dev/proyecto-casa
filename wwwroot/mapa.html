<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa · Proyecto C.A.S.A.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="mapa">
  <div id="casa-nav"></div>

  <main id="contenido" class="casa-main">
    <header class="casa-hero casa-hero--page">
      <div class="container">
        <h1>Mapa de Sucre</h1>
        <p>Cada distrito tiene su cinta de color. Toca una zona o un pin para ver más.</p>
      </div>
    </header>

    <div class="container casa-overlap">
      <div id="map-status"></div>
      <div class="row g-4">
        <div class="col-lg-9 order-lg-2">
          <div class="casa-map-shell">
            <div id="map" role="application" aria-label="Mapa de distritos y establecimientos de Sucre"></div>
          </div>
        </div>

        <aside class="col-lg-3 order-lg-1">
          <div class="casa-map-legend">
            <h3>Capas</h3>
            <div class="form-check form-switch mb-1">
              <input class="form-check-input" type="checkbox" role="switch" id="t-distritos" checked>
              <label class="form-check-label fw-bold" for="t-distritos">Distritos</label>
            </div>
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" role="switch" id="t-lugares" checked>
              <label class="form-check-label fw-bold" for="t-lugares">Veterinarias y albergues</label>
            </div>

            <h3>Distritos</h3>
            <div id="leyenda" aria-live="polite"><div class="casa-skeleton" style="min-height:120px" aria-hidden="true"></div></div>

            <hr>
            <div class="d-flex flex-column gap-2 small fw-bold">
              <span class="d-flex align-items-center gap-2"><span class="casa-pin" style="width:26px;height:26px;font-size:13px"><span>🩺</span></span> Veterinaria</span>
              <span class="d-flex align-items-center gap-2"><span class="casa-pin casa-pin--blue" style="width:26px;height:26px;font-size:13px"><span>🏠</span></span> Albergue</span>
            </div>
            <p class="small text-muted mt-3 mb-0" id="nota-mapa"></p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div id="casa-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const E = CASA.endpoints, g = CASA.g, esc = CASA.esc;
      const $ = (id) => document.getElementById(id);

      /* ---------- Mapa base ---------- */
      const map = L.map('map').setView([CASA.SUCRE.lat, CASA.SUCRE.lng], CASA.SUCRE.zoom);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      const capaDistritos = L.featureGroup().addTo(map);
      const capaLugares = L.featureGroup().addTo(map);

      /* ---------- Datos ---------- */
      const [dis, est, tip, mas] = await Promise.allSettled([
        CASA.api.list(E.distritos),
        CASA.api.list(E.establecimientos),
        CASA.api.list(E.tiposEstablecimiento),
        CASA.api.list(E.mascotas)
      ]);

      if (dis.status !== 'fulfilled' && est.status !== 'fulfilled') {
        CASA.ui.error($('map-status'), dis.reason, E.distritos, 'mb-4');
        $('leyenda').innerHTML = '<p class="small text-muted">Sin datos para mostrar.</p>';
        return;
      }

      const distritos = dis.status === 'fulfilled' ? dis.value : [];
      const lugares = est.status === 'fulfilled' ? est.value : [];
      const tiposById = tip.status === 'fulfilled' ? CASA.byId(tip.value) : {};
      const mascotas = mas.status === 'fulfilled' ? mas.value : [];

      /* ---------- Distritos: polígonos con su color de cinta ---------- */
      const poligonos = new Map();   // id → capa
      const filasLeyenda = distritos.map((d) => {
        const id = g(d, 'id');
        const color = CASA.cintaColor(g(d, 'colorCinta'));
        const pts = CASA.parsePolygon(g(d, 'poligono'));
        const nLugares = lugares.filter((e) => g(e, 'distritoId') === id).length;
        const nMascotas = mascotas.filter((m) => g(m, 'distritoId') === id).length;

        if (pts) {
          const capa = L.polygon(pts, { color, weight: 3, fillColor: color, fillOpacity: 0.22 })
            .bindTooltip(esc(g(d, 'nombre') || 'Distrito'), { sticky: true })
            .bindPopup(`<h4>${esc(g(d, 'nombre') || 'Distrito')}</h4>
              <div>🎀 Cinta: ${esc(g(d, 'colorCinta') || '—')}</div>
              <div>🩺 ${nLugares} ${nLugares === 1 ? 'lugar' : 'lugares'}</div>
              <div>🐶 ${nMascotas} ${nMascotas === 1 ? 'mascota' : 'mascotas'}</div>`)
            .addTo(capaDistritos);
          poligonos.set(id, capa);
        }
        return { id, nombre: g(d, 'nombre') || 'Distrito', color, tienePoligono: !!pts, nLugares };
      });

      $('leyenda').innerHTML = filasLeyenda.length
        ? filasLeyenda.map((f) => `
            <button type="button" class="casa-legend-item" data-id="${esc(f.id)}" ${f.tienePoligono ? '' : 'disabled title="Este distrito no tiene un polígono válido"'}>
              <span class="casa-legend-swatch" style="--ribbon:${esc(f.color)}"></span>
              <span>${esc(f.nombre)}</span>
              <span class="count">${f.nLugares}</span>
            </button>`).join('')
        : '<p class="small text-muted mb-0">Aún no hay distritos registrados.</p>';

      $('leyenda').addEventListener('click', (ev) => {
        const b = ev.target.closest('.casa-legend-item');
        const capa = b && polygonoPorId(b.dataset.id);
        if (!capa) return;
        map.fitBounds(capa.getBounds(), { padding: [30, 30] });
        capa.openPopup();
      });
      function polygonoPorId(id) { return [...poligonos].find(([k]) => String(k) === String(id))?.[1]; }

      /* ---------- Establecimientos: pines ---------- */
      const pines = new Map();       // id → marcador
      let sinCoordenadas = 0;
      lugares.forEach((e) => {
        const ll = CASA.parseLatLng(g(e, 'ubicacion'));
        if (!ll) { sinCoordenadas++; return; }
        const tipo = tiposById[g(e, 'tipoEstableciminetoId', 'tipoEstablecimientoId')] || g(e, 'tipoEstableciminetos');
        const nombreTipo = g(tipo, 'nombre') || 'Establecimiento';
        const esAlbergue = /albergue|refugio|hogar/.test(CASA.strip(nombreTipo));
        const icon = L.divIcon({
          className: '',
          html: `<div class="casa-pin ${esAlbergue ? 'casa-pin--blue' : ''}"><span>${esAlbergue ? '🏠' : '🩺'}</span></div>`,
          iconSize: [38, 38], iconAnchor: [19, 38], popupAnchor: [0, -36]
        });
        const tel = String(g(e, 'telefono') || '');
        const marcador = L.marker(ll, { icon, title: g(e, 'nombre') || '' })
          .bindPopup(`<h4>${esc(g(e, 'nombre') || 'Sin nombre')}</h4>
            <div>${esc(nombreTipo)}${g(e, 'estado') ? ' · ' + esc(g(e, 'estado')) : ''}</div>
            ${g(e, 'direccion') ? `<div>📍 ${esc(g(e, 'direccion'))}</div>` : ''}
            ${g(e, 'horario') ? `<div>🕒 ${esc(g(e, 'horario'))}</div>` : ''}
            ${tel ? `<div>📞 <a href="tel:${esc(tel.replace(/[^\d+]/g, ''))}">${esc(tel)}</a></div>` : ''}`)
          .addTo(capaLugares);
        pines.set(String(g(e, 'id')), marcador);
      });

      /* ---------- Encuadre, notas y capas ---------- */
      const todo = L.featureGroup([capaDistritos, capaLugares]);
      if (todo.getLayers().some((l) => l.getLayers().length)) map.fitBounds(todo.getBounds(), { padding: [30, 30] });

      const notas = [];
      if (distritos.some((d) => !CASA.parsePolygon(g(d, 'poligono')))) notas.push('Algunos distritos no tienen un polígono que el mapa pueda leer.');
      if (sinCoordenadas) notas.push(`${sinCoordenadas} ${sinCoordenadas === 1 ? 'lugar no tiene' : 'lugares no tienen'} coordenadas válidas ("latitud, longitud").`);
      $('nota-mapa').textContent = notas.join(' ');

      $('t-distritos').addEventListener('change', (ev) => ev.target.checked ? capaDistritos.addTo(map) : map.removeLayer(capaDistritos));
      $('t-lugares').addEventListener('change', (ev) => ev.target.checked ? capaLugares.addTo(map) : map.removeLayer(capaLugares));

      // Llegada desde "Ver en el mapa": mapa.html?establecimiento=ID
      const objetivo = new URLSearchParams(location.search).get('establecimiento');
      if (objetivo && pines.has(objetivo)) {
        const pin = pines.get(objetivo);
        map.setView(pin.getLatLng(), 17);
        pin.openPopup();
      }
    })();
  </script>
</body>
</html>
